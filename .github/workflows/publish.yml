name: Publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@parselab"

      - run: npm ci

      - run: npm run typecheck --workspace=@parselab/ui

      - run: npm run build --workspace=@parselab/ui

      - run: npm publish --access public --workspace=@parselab/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
