name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # parseui first: the docs app type-checks against its built dist/types.
      - run: npm run build --workspace=parseui
      - run: npm run typecheck
