name: Publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - run: npm run typecheck --workspace=parseui

      # Needs the "parseui" npm organization for the @parseui scope.
      - run: npm publish --access public --workspace=@parseui/icons
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm publish --access public --workspace=parseui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
